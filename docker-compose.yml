services:
  db:
    image: postgres:16-alpine
    container_name: homework30_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: homework30_redis
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build: .
    image: ${DOCKER_IMAGE:-homework30}:latest
    container_name: homework30_migrate
    restart: "no"
    env_file:
      - .env

    command:
      - sh
      - -c
      - >-
        python manage.py migrate --noinput &&
        python manage.py collectstatic --noinput

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media

  web:
    build: .
    image: ${DOCKER_IMAGE:-homework30}:latest
    container_name: homework30_web
    restart: unless-stopped
    init: true
    env_file:
      - .env

    command:
      - gunicorn
      - config.wsgi:application
      - --bind
      - 0.0.0.0:8000
      - --workers
      - "3"
      - --timeout
      - "120"

    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

    expose:
      - "8000"

    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import socket;
          s=socket.create_connection(('127.0.0.1', 8000), 5);
          s.close()"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  celery:
    build: .
    image: ${DOCKER_IMAGE:-homework30-web}:latest
    container_name: homework30_celery
    restart: unless-stopped
    init: true
    env_file:
      - .env
    command: celery -A config worker -l info
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - media_volume:/app/media

  celery-beat:
    build: .
    image: ${DOCKER_IMAGE:-homework30-web}:latest
    container_name: homework30_celery_beat
    restart: unless-stopped
    init: true
    env_file:
      - .env
    command: >
      celery -A config beat -l info
      --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: homework30_nginx
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
